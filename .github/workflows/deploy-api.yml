name: deploy-api

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
  push:
    branches: [main]
    paths:
      - packages/api/**
      - packages/db/**
      - package.json
      - pnpm-lock.yaml
      - scripts/deploy-api.mjs
      - .github/workflows/deploy-api.yml

concurrency:
  group: deploy-api-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    # Kill switch for private-repo billing: set the repository variable
    # DEPLOY_API_ON_PUSH to "false" and pushes stop spending Actions minutes.
    if: github.event.inputs.environment == 'staging' || (github.event_name == 'push' && vars.DEPLOY_API_ON_PUSH != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bookmark, migrate and deploy
        run: node scripts/deploy-api.mjs --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bookmark, migrate and deploy
        run: node scripts/deploy-api.mjs --env production --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
