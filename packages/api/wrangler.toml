name = "aqui-suena-api"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Supabase Auth: configured as secrets via `wrangler secret put SUPABASE_URL`
# and `wrangler secret put SUPABASE_ANON_KEY` (not stored in this file).
# Browser origins allowed by CORS. Setting this variable REPLACES the built-in
# defaults, so it must list every origin that has to keep working:
# http://localhost:3000 (web dev), tauri://localhost and http://tauri.localhost
# (desktop), plus the deployed web domain. The Pages origin depends on the
# project name used by `pnpm deploy:web` (default aqui-suena-web). Redeploy the
# Worker after changing it.
ALLOWED_ORIGINS = "http://localhost:3000,tauri://localhost,http://tauri.localhost,https://aqui-suena-web.pages.dev"

# Optional AI Gateway id. When set, Workers AI calls route through that gateway
# for free analytics, caching and rate limiting. Create it in the dashboard
# (AI -> AI Gateway) and put its id here. Leave empty to call Workers AI directly.
AI_GATEWAY_ID = "aqui-suena"

[[d1_databases]]
binding = "aqui_suena_db"
database_name = "aqui-suena-db"
database_id = "8737a12b-6bff-4fd2-bed0-34a48d6cddd7"

[ai]
binding = "AI"

[[vectorize]]
binding = "PLAN_VECTORS"
index_name = "aqui-suena-plan-catalog"

# ----------------------------------------------------------------------------
# Staging environment. Deploy with: npx wrangler deploy --env staging
# ----------------------------------------------------------------------------
[env.staging]
name = "aqui-suena-api-staging"

[env.staging.vars]
ALLOWED_ORIGINS = "http://localhost:3000,tauri://localhost,http://tauri.localhost,https://aqui-suena-web-staging.pages.dev"
AI_GATEWAY_ID = "aqui-suena"

[[env.staging.d1_databases]]
binding = "aqui_suena_db"
database_name = "aqui-suena-db-staging"
database_id = "8737a12b-6bff-4fd2-bed0-34a48d6cddd7"

[env.staging.ai]
binding = "AI"

[[env.staging.vectorize]]
binding = "PLAN_VECTORS"
index_name = "aqui-suena-plan-catalog"
