name = "aqui-suena-api"
main = "src/server/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Supabase Auth: configured as secrets via `wrangler secret put SUPABASE_URL`
# and `wrangler secret put SUPABASE_ANON_KEY` (not stored in this file).
# Browser origins allowed by CORS. Setting this variable REPLACES the built-in
# defaults, so it must list every origin that has to keep working:
# http://localhost:3000 (web dev), tauri://localhost and http://tauri.localhost
# (desktop), plus the deployed web domain. The Pages origin depends on the
# project name used by `pnpm deploy:web` (default aqui-suena-web). Redeploy the
# Worker after changing it.
ALLOWED_ORIGINS = "http://localhost:3000,tauri://localhost,http://tauri.localhost,https://aqui-suena-web.pages.dev"

# Optional AI Gateway id. When set, Workers AI calls route through that gateway
# for free analytics, caching and rate limiting. Create it in the dashboard
# (AI -> AI Gateway) and put its id here. Leave empty to call Workers AI directly.
AI_GATEWAY_ID = "aqui-suena"

# Production database. The default environment is still not deployed: it needs
# the Supabase project and the Worker secrets first (see README, "Environment
# variables"). Keep this id separate from the staging one.
[[d1_databases]]
binding = "aqui_suena_db"
database_name = "aqui-suena-db"
database_id = "fba61331-c2d8-4e26-96b3-c732ff99dcd0"
migrations_dir = "../db/migrations"

[ai]
binding = "AI"

[[vectorize]]
binding = "PLAN_VECTORS"
index_name = "aqui-suena-plan-catalog"

# ----------------------------------------------------------------------------
# Staging environment. Deploy with: npx wrangler deploy --env staging
# ----------------------------------------------------------------------------
[env.staging]
name = "aqui-suena-api-staging"

[env.staging.vars]
ALLOWED_ORIGINS = "http://localhost:3000,tauri://localhost,http://tauri.localhost,https://aqui-suena-web-staging.pages.dev"
AI_GATEWAY_ID = "aqui-suena"
# Base URL used by POST /admin/seed-stations for the owned harness files.
# Production intentionally omits it: the harness never ships to prod.
STREAM_BASE_URL = "https://aqui-suena-web-staging.pages.dev"

# Facturama sandbox: non-secret emitter settings. The API user and password are
# Worker secrets (`wrangler secret put FACTURAMA_USER --env staging`).
FACTURAMA_BASE_URL = "https://apisandbox.facturama.mx"
# Sandbox-only: the account RFC is personal and cannot carry the test CSD, so
# staging stamps the SAT test RFC through the multiemisor endpoint. Production
# uses the `web` mode with the company CSD and no issuer block.
FACTURAMA_MODE = "multiemisor"
FACTURAMA_EXPEDITION_PLACE = "42501"
FACTURAMA_IVA_RATE = "0.16"
FACTURAMA_PRODUCT_CODE = "01010101"
FACTURAMA_UNIT_CODE = "E48"
FACTURAMA_SERIES = "A"
FACTURAMA_ISSUER_RFC = "EKU9003173C9"
FACTURAMA_ISSUER_NAME = "ESCUELA KEMPER URGATE"
FACTURAMA_ISSUER_FISCAL_REGIME = "601"

[[env.staging.d1_databases]]
binding = "aqui_suena_db"
database_name = "aqui-suena-db-staging"
database_id = "8737a12b-6bff-4fd2-bed0-34a48d6cddd7"
migrations_dir = "../db/migrations"

[env.staging.ai]
binding = "AI"

[[env.staging.vectorize]]
binding = "PLAN_VECTORS"
index_name = "aqui-suena-plan-catalog"
