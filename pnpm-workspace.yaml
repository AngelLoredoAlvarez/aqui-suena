packages:
  - "apps/*"
  - "packages/*"

# Single-version policy for every package that owns runtime state (React
# contexts, native modules). pnpm materializes one directory per resolved peer
# set, and @types/react is a peer too: two type versions fork the runtime module
# into two module registries, so a provider and its consumer stop sharing a
# context. Keep this catalog aligned with scripts/check-singletons.mjs.
catalog:
  "@tanstack/react-query": 5.104.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  expo-audio: 58.0.10
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
  react-native-gesture-handler: 3.3.0
  react-native-reanimated: 4.7.1
  react-native-safe-area-context: 5.10.1
  react-native-screens: 4.30.0
  tamagui: 3.1.2

# Hard enforcement even if a transitive dependency asks for something else.
overrides:
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  react: "catalog:"
  react-dom: "catalog:"

allowBuilds:
  esbuild: true
  "@infisical/cli": true
  "@swc/core": true
  workerd: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30 || 57.0.31 || 58.1.13 || 58.1.14'
  - '@expo/prebuild-config@57.0.19 || 58.0.15'
  - expo-asset@57.0.20 || 58.0.17 || 58.0.18
  - expo-constants@57.0.22 || 58.0.13
  - expo-modules-autolinking@57.0.16 || 58.0.14
  - expo-modules-core@57.0.23 || 58.0.23 || 58.0.24
  - expo@57.0.29 || 57.0.30 || 58.0.16 || 58.0.17
  - '@expo/metro-runtime@57.0.17 || 58.0.15'
  - '@expo/ui@57.0.24 || 57.0.25'
  - expo-linking@57.0.13 || 58.0.14
  - expo-router@57.0.27 || 57.0.28 || 58.0.24 || 58.0.25
  - '@expo/router-server@57.0.13 || 58.0.15 || 58.0.16'
  - babel-preset-expo@57.0.16 || 58.0.18 || 58.0.19
  - '@turbo/darwin-64@2.11.9'
  - '@turbo/darwin-arm64@2.11.9'
  - '@turbo/linux-64@2.11.9'
  - '@turbo/linux-arm64@2.11.9'
  - '@turbo/windows-64@2.11.9'
  - '@turbo/windows-arm64@2.11.9'
  - turbo@2.11.9
  - '@expo/metro-config@58.0.15 || 58.0.16'
  - expo-file-system@58.0.10
  - expo-font@58.0.9
