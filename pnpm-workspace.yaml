packages:
  - "apps/*"
  - "packages/*"

# Single-version policy for every package that owns runtime state (React
# contexts, native modules). pnpm materializes one directory per resolved peer
# set, and @types/react is a peer too: two type versions fork the runtime module
# into two module registries, so a provider and its consumer stop sharing a
# context. Keep this catalog aligned with scripts/check-singletons.mjs.
catalog:
  "@tanstack/react-query": 5.104.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-gesture-handler: 2.32.0
  react-native-reanimated: 4.5.1
  react-native-safe-area-context: 5.7.0
  react-native-screens: 4.26.2
  tamagui: 2.7.7

# Hard enforcement even if a transitive dependency asks for something else.
overrides:
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  react: "catalog:"
  react-dom: "catalog:"

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.30 || 57.0.31'
  - '@expo/prebuild-config@57.0.19'
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29 || 57.0.30
  - '@expo/metro-runtime@57.0.17'
  - '@expo/ui@57.0.24 || 57.0.25'
  - expo-linking@57.0.13
  - expo-router@57.0.27 || 57.0.28
  - '@expo/router-server@57.0.13'
  - babel-preset-expo@57.0.16
  - '@turbo/darwin-64@2.11.9'
  - '@turbo/darwin-arm64@2.11.9'
  - '@turbo/linux-64@2.11.9'
  - '@turbo/linux-arm64@2.11.9'
  - '@turbo/windows-64@2.11.9'
  - '@turbo/windows-arm64@2.11.9'
  - turbo@2.11.9
